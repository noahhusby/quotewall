[package]
name = "quotewall"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
env_logger = "0.11.11"
escpos = { version = "0.19.0", default-features = false, features = ["std"] }
garde = { version = "0.23.0", features = ["derive"] }
log = "0.4.33"
mime_guess = "2.0.5"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.0", features = ["rt", "rt-multi-thread", "macros"] }
serde_json = "1.0.150"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
